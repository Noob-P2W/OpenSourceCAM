name: Set up issue labels
on:
  push:
    branches: [main]
    paths:
      - .github/labels.json
      - .github/workflows/issue-labels.yml
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  labels:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const desired = JSON.parse(fs.readFileSync('.github/labels.json', 'utf8'));
            const existing = await github.paginate(github.rest.issues.listLabelsForRepo, {
              ...context.repo, per_page: 100
            });
            const names = new Set(existing.map(label => label.name.toLowerCase()));
            for (const label of desired) {
              if (names.has(label.name.toLowerCase())) {
                core.info(`Keeping existing label: ${label.name}`);
                continue;
              }
              await github.rest.issues.createLabel({...context.repo, ...label});
              names.add(label.name.toLowerCase());
              core.info(`Created label: ${label.name}`);
            }
