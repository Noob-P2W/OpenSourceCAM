name: PWA build and optional deployment
on:
  push:
    branches: [main, pwa-shop-hosting]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to GitHub Pages (enable Pages with GitHub Actions first)
        type: boolean
        default: false
concurrency:
  group: pwa-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: web
      - name: Install browser test dependencies
        run: |
          mkdir -p dist
          set -o pipefail
          # Avoid intermittent DNS failures on the runner's Azure mirror list.
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i \
              -e 's#mirror+file:/etc/apt/apt-mirrors.txt#https://archive.ubuntu.com/ubuntu#g' \
              -e 's#mirror+file:/etc/apt/apt-mirrors-security.txt#https://security.ubuntu.com/ubuntu#g' \
              /etc/apt/sources.list.d/ubuntu.sources
          fi
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' | sudo tee /etc/apt/apt.conf.d/80-cam-ci-retries > /dev/null
          cd web
          npx playwright install --with-deps chromium 2>&1 | tee ../dist/ci-failure.txt
      - name: Browser quality gate
        run: |
          CHROMIUM_PATH="$(node --input-type=module -e "import {chromium} from './web/node_modules/playwright/index.mjs'; console.log(chromium.executablePath())")" python3 scripts/check.py web
      - uses: actions/checkout@v4
        if: failure() && github.ref == 'refs/heads/main'
        with:
          path: ci-report
      - name: Publish failed check diagnostics for maintainers
        if: failure() && github.ref == 'refs/heads/main'
        run: |
          if [ -f dist/ci-failure.txt ]; then
            cd ci-report
            git switch --orphan ci-diagnostics
            cp ../dist/ci-failure.txt failure.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add failure.txt
            git commit -m "Report failed quality gate $GITHUB_SHA"
            git push --force origin HEAD:ci-diagnostics
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: opensourcecam-shop
          path: dist/opensourcecam-shop.zip
      - uses: actions/upload-artifact@v4
        with:
          name: opensourcecam-pwa
          path: dist/pwa
  deploy:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
      - uses: actions/download-artifact@v4
        with:
          name: opensourcecam-pwa
          path: incoming
      - name: Update the Pages branch after tests pass
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import shutil
          root = Path('published')
          for path in root.iterdir():
              if path.name == '.git':
                  continue
              if path.is_dir():
                  shutil.rmtree(path)
              else:
                  path.unlink()
          shutil.copytree('incoming', root, dirs_exist_ok=True)
          (root / '.nojekyll').touch()
          PYTHON
          git -C published config user.name 'github-actions[bot]'
          git -C published config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C published add .
          if ! git -C published diff --cached --quiet; then
            git -C published commit -m "Deploy tested PWA $GITHUB_SHA"
            git -C published push origin gh-pages
          fi
      # GITHUB_TOKEN pushes do not themselves trigger a Pages build.
      - name: Request the Pages branch build explicitly
        uses: actions/github-script@v7
        with:
          script: |
            await github.request('POST /repos/{owner}/{repo}/pages/builds', {
              owner: context.repo.owner,
              repo: context.repo.repo
            });
